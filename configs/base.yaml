# Settled empirically in scripts/sweep_ocr.py and scripts/test_crop2.py.
# See docs/measurements.md for the sweep tables behind these numbers.

dataset:
  hf_name: naver-clova-ix/cord-v2
  cache_dir: data/processed
  min_train_words: 100 # categories below this are mapped to O

ocr:
  tesseract_exe: 'C:\Program Files\Tesseract-OCR\tesseract.exe'
  lang: ind+eng
  psm: 11 # sparse text; best recall on photographed receipts
  scale: 3 # 3x upscale before OCR
  clahe_clip: 3.0
  clahe_grid: 8
  min_confidence: 30 # drops background-texture fragments
  crop: true

align:
  iou_threshold: 0.3 # 73.4% recall at psm 11; 0.5 loses 16 points
  fallback_text_match: true # second pass for annotations IoU missed
  fallback_y_tolerance: 40 # px; text match must be on roughly the same line

model:
  name: microsoft/layoutlmv3-base
  max_length: 512
  overlap_words: 64 # words re-encoded between consecutive windows
  use_images: false # text+layout only; true adds the visual branch (ablation)

train:
  output_dir: outputs/layoutlmv3-ocr
  epochs: 20
  patience: 5 # epochs without a validation micro-F1 gain
  batch_size: 8 # fits a 16GB T4 at 512 tokens in fp16
  grad_accum: 4 # effective batch 32
  lr: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  fp16: true # ignored on CPU, where fp16 autocast is unsupported
  seed: 42
  num_workers: 0 # encodings are precomputed; workers only add spawn overhead
  annotation_counts: docs/annotation_counts.json
  wandb:
    enabled: false # falls back to the CSV log, which is always written
    project: receipt-extraction
